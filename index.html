  <style>

    body {

    h1,
    h2,
    h3,

      font-family: "Orbitron", sans-serif;

    }

    .panel {
      position: relative;
      background: linear-gradient(180deg, #0B1424 0%, #08101C 100%);
      border: 1px solid #1C3352;
      clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(76, 211, 255, 0.55) 0 10px, transparent 10px) top left / 100% 1px no-repeat,
        linear-gradient(90deg, rgba(76, 211, 255, 0.55) 0 10px, transparent 10px) bottom right / 100% 1px no-repeat;
    }

    .scan-bg {
      background-image: repeating-linear-gradient(180deg, rgba(76, 211, 255, 0.035) 0px, rgba(76, 211, 255, 0.035) 1px, transparent 1px, transparent 3px);

<body>
  <div id="app"></div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ============================================================
    // 1. CONFIG — paste your Supabase project keys here before deploying.
    //    The anon key is designed to be public in client-side code;
    //    your data is protected by the RLS policies in schema.sql, not secrecy.
    // ============================================================
    const SUPABASE_URL = "https://eotmbsbbfvmzcokmighr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvdG1ic2JiZnZtemNva21pZ2hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzQzODksImV4cCI6MjEwNTU1MDM4OX0.3u4uMzLuOAXhqkjygDnoUe_GP-NQItWTEu9Zh9MqZ_I";

    const isConfigured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";
    const supabase = isConfigured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // ============================================================
    // 2. STATIC DATA — rank/exp system, calorie math, workout split + pool
    // ============================================================
    const RANKS = ["E", "D", "C", "B", "A", "S"];
    const RANK_THRESHOLDS = { E: 0, D: 500, C: 1500, B: 3500, A: 7000, S: 12000 };
    const rankIndexOf = (r) => RANKS.indexOf(r);
    const rankForExp = (totalExp) => {
      let cur = "E";
      for (const r of RANKS) if (totalExp >= RANK_THRESHOLDS[r]) cur = r;
      return cur;
    };
    const nextRank = (r) => (rankIndexOf(r) >= RANKS.length - 1 ? null : RANKS[rankIndexOf(r) + 1]);
    const rankProgress = (totalExp) => {
      const rank = rankForExp(totalExp);
      const next = nextRank(rank);
      const floor = RANK_THRESHOLDS[rank];
      if (!next) return { rank, next, pct: 1 };
      const span = RANK_THRESHOLDS[next] - floor;
      return { rank, next, pct: Math.min(1, (totalExp - floor) / span) };
    };
    const levelForExp = (totalExp) => Math.floor(totalExp / 100) + 1;
    const EXP_REWARDS = { dailyQuest: 20, trainingQuestBase: 100, restDayQuest: 15 };
    const trainingExpReward = (rank) => EXP_REWARDS.trainingQuestBase + rankIndexOf(rank) * 15;

    const ACTIVITY_LEVELS = [
      { key: "sedentary", label: "Sedentary (little/no exercise)", multiplier: 1.2 },
      { key: "light", label: "Light (1-3 days/week)", multiplier: 1.375 },
      { key: "moderate", label: "Moderate (3-5 days/week)", multiplier: 1.55 },
      { key: "active", label: "Active (6-7 days/week)", multiplier: 1.725 },
      { key: "very_active", label: "Very active (physical job + training)", multiplier: 1.9 },
    ];
    const calcBMR = ({ sex, weightKg, heightCm, age }) => {
      if (!weightKg || !heightCm || !age) return null;
      const base = 10 * weightKg + 6.25 * heightCm - 5 * age;
      return sex === "female" ? base - 161 : base + 5;
    };
    const calcTDEE = ({ bmr, activityKey }) => {
      if (!bmr) return null;
      const level = ACTIVITY_LEVELS.find((l) => l.key === activityKey) || ACTIVITY_LEVELS[1];
      return Math.round(bmr * level.multiplier);
    };
    const DEFICIT_PRESETS = [
      { key: "mild", label: "Mild", perDay: 250, weeklyLossKg: 0.25 },
      { key: "moderate", label: "Moderate", perDay: 500, weeklyLossKg: 0.5 },
      { key: "aggressive", label: "Aggressive", perDay: 750, weeklyLossKg: 0.75 },
    ];
    const calcDeficitTargets = (tdee) => {
      if (!tdee) return [];
      return DEFICIT_PRESETS.map((p) => ({ ...p, target: Math.max(1200, tdee - p.perDay) }));
    };

    const BASE_SPLIT = [
      {
        id: 1, name: "Chest / Shoulders / Triceps", exercises: [
          { slot: "chest_press", name: "Dumbbell Floor Press", sets: 3, reps: "10-12" },
          { slot: "chest_fly", name: "Dumbbell Fly on Floor", sets: 3, reps: "12-15" },
          { slot: "shoulder_press", name: "Dumbbell Shoulder Press", sets: 3, reps: "10-12" },
          { slot: "lateral_raise", name: "Dumbbell Lateral Raise", sets: 3, reps: "12-15" },
          { slot: "triceps", name: "Dumbbell Overhead Triceps Extension", sets: 3, reps: "12-15" },
        ]
      },
      {
        id: 2, name: "Legs", exercises: [
          { slot: "squat", name: "Goblet Squat", sets: 3, reps: "12-15" },
          { slot: "hinge", name: "Dumbbell Romanian Deadlift", sets: 3, reps: "10-12" },
          { slot: "lunge", name: "Reverse Lunges", sets: 3, reps: "10/leg" },
          { slot: "calves", name: "Dumbbell Calf Raises", sets: 3, reps: "15-20" },
          { slot: "glutes", name: "Glute Bridge", sets: 3, reps: "15" },
        ]
      },
      {
        id: 3, name: "Back / Biceps", exercises: [
          { slot: "row_single", name: "One-Arm Dumbbell Row", sets: 3, reps: "10-12/arm" },
          { slot: "row_bent", name: "Bent-Over Dumbbell Row", sets: 3, reps: "10-12" },
          { slot: "rear_delt", name: "Dumbbell Reverse Fly", sets: 3, reps: "12-15" },
          { slot: "biceps", name: "Dumbbell Biceps Curl", sets: 3, reps: "10-12" },
          { slot: "biceps_hammer", name: "Hammer Curl", sets: 3, reps: "10-12" },
        ]
      },
      {
        id: 4, name: "Legs + Core", exercises: [
          { slot: "squat", name: "Goblet Squat", sets: 3, reps: "12-15" },
          { slot: "hinge", name: "Romanian Deadlift", sets: 3, reps: "10-12" },
          { slot: "lunge", name: "Reverse Lunges", sets: 3, reps: "10/leg" },
          { slot: "glutes", name: "Glute Bridge", sets: 3, reps: "15" },
          { slot: "core_lower", name: "Lying Leg Raises", sets: 3, reps: "12-15" },
          { slot: "core_stability", name: "Dead Bug", sets: 3, reps: "10/side" },
        ]
      },
      {
        id: 5, name: "Full Body", exercises: [
          { slot: "squat", name: "Goblet Squat", sets: 3, reps: "12-15" },
          { slot: "chest_press", name: "Dumbbell Floor Press", sets: 3, reps: "10-12" },
          { slot: "row_bent", name: "Dumbbell Row", sets: 3, reps: "10-12" },
          { slot: "hinge", name: "Romanian Deadlift", sets: 3, reps: "10-12" },
          { slot: "shoulder_press", name: "Shoulder Press", sets: 3, reps: "10-12" },
          { slot: "biceps_hammer", name: "Hammer Curl", sets: 3, reps: "10-12" },
        ]
      },
    ];

    const EXERCISE_POOL = [
      { slot: "squat", name: "Bulgarian Split Squat (chair-assisted)", sets: 3, reps: "8-10/leg", unlock: "C", days: [2, 4, 5] },
      { slot: "chest_press", name: "Dumbbell Thruster", sets: 3, reps: "10-12", unlock: "C", days: [1, 5] },
      { slot: "row_single", name: "Renegade Row", sets: 3, reps: "8-10/arm", unlock: "C", days: [3] },
      { slot: "hinge", name: "Single-Leg RDL", sets: 3, reps: "8-10/leg", unlock: "C", days: [2, 4] },
      { slot: "triceps", name: "Skull Crushers (floor)", sets: 3, reps: "10-12", unlock: "C", days: [1] },
      { slot: "shoulder_press", name: "Arnold Press", sets: 3, reps: "10-12", unlock: "C", days: [1, 5] },
      { slot: "core_stability", name: "Plank Shoulder Taps", sets: 3, reps: "30-40s", unlock: "C", days: [4] },
      { slot: "lunge", name: "Walking Lunges", sets: 3, reps: "12/leg", unlock: "C", days: [2, 4] },
      { slot: "squat", name: "Dumbbell Jump Squat", sets: 3, reps: "10-12", unlock: "B", days: [2, 4, 5] },
      { slot: "core_lower", name: "Weighted Mountain Climbers", sets: 3, reps: "30-40s", unlock: "B", days: [4] },
      { slot: "lunge", name: "Weighted Step-Ups", sets: 3, reps: "10/leg", unlock: "B", days: [2, 4] },
      { slot: "chest_fly", name: "Incline Push-Ups (hands elevated)", sets: 3, reps: "AMRAP", unlock: "B", days: [1] },
      { slot: "row_bent", name: "Dumbbell Snatch", sets: 3, reps: "8/arm", unlock: "B", days: [3, 5] },
      { slot: "triceps", name: "Burpees", sets: 3, reps: "10-12", unlock: "B", days: [1] },
      { slot: "chest_press", name: "Squat-to-Press Complex", sets: 4, reps: "8-10", unlock: "A", days: [5] },
      { slot: "row_single", name: "Single-Arm Devil Press", sets: 3, reps: "6-8/arm", unlock: "A", days: [3] },
      { slot: "chest_fly", name: "Pike Push-Ups", sets: 3, reps: "8-12", unlock: "A", days: [1] },
      { slot: "hinge", name: "Row-to-Curl Complex", sets: 4, reps: "8-10", unlock: "A", days: [3] },
      { slot: "squat", name: "Squat-Curl-Press Circuit", sets: 4, reps: "10", unlock: "S", days: [2, 4, 5] },
      { slot: "core_stability", name: "Burpee Ladder Finisher", sets: 1, reps: "1-10 ladder", unlock: "S", days: [4] },
      { slot: "row_bent", name: "Full Compound Circuit (row-squat-press)", sets: 4, reps: "8/move", unlock: "S", days: [3, 5] },
    ];

    const SWAPS_PER_TIER = { E: 0, D: 0, C: 1, B: 2, A: 2, S: 3 };
    const BONUS_SETS_BY_RANK = { E: 0, D: 0, C: 0, B: 1, A: 1, S: 2 };
    const rankAtLeast = (cur, req) => rankIndexOf(cur) >= rankIndexOf(req);

    function buildWorkoutForDay(splitDayId, rank) {
      const day = BASE_SPLIT.find((d) => d.id === splitDayId);
      if (!day) return null;
      const eligible = EXERCISE_POOL
        .filter((p) => p.days.includes(splitDayId) && rankAtLeast(rank, p.unlock))
        .sort((a, b) => rankIndexOf(b.unlock) - rankIndexOf(a.unlock));
      const budget = SWAPS_PER_TIER[rank] ?? 0;
      const swapMap = new Map();
      for (const p of eligible) {
        if (swapMap.size >= budget) break;
        if (swapMap.has(p.slot)) continue;
        if (!day.exercises.some((e) => e.slot === p.slot)) continue;
        swapMap.set(p.slot, p);
      }
      const bonus = BONUS_SETS_BY_RANK[rank] ?? 0;
      const exercises = day.exercises.map((base) => {
        const swap = swapMap.get(base.slot);
        const src = swap || base;
        return { ...src, sets: src.sets + bonus, isUpgraded: Boolean(swap) };
      });
      return { ...day, exercises, rank };
    }

    const TRAINING_DAY_DAILY_QUESTS = [
      { key: "hydration", text: "Drink 2L of water" },
      { key: "walk_short", text: "Walk for 10-15 minutes" },
    ];
    const REST_DAY_QUESTS = [
      { key: "hydration", text: "Drink 2L of water" },
      { key: "stretch", text: "Stretch / mobility for 10 minutes" },
      { key: "walk_light", text: "Light walk (optional, 10-20 minutes)" },
    ];

    // ============================================================
    // 3. STATE
    // ============================================================
    const state = {
      loading: true,
      error: null,
      tab: "status",
      profile: null,
      schedule: [],
      stats: null,
      completions: [],
      weightLog: [],
      expLog: [],
      rankUpEvent: null,
      toast: null,
      checkedExercises: {},
      scheduleForm: null, // local editable copy
      profileForm: null,  // local editable copy
      weightInput: "",
      setsDone: {},               // NEW: which sets you've tapped today, e.g. { "squat-0": true }
      restTimer: null,            // NEW: { key, endsAt } while a rest countdown is running
      trainingCompleteEvent: false, // NEW: shows the "training complete" popup
    };

    function todayISO() {
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }
    function dayOfWeek(dateStr) { return new Date(dateStr + "T00:00:00").getDay(); }
    const DATE = todayISO();

    // ============================================================
    // 4. SUPABASE I/O
    // ============================================================
    async function fetchAll() {
      state.loading = true; state.error = null; render();
      try {
        const [{ data: p }, { data: sched }, { data: st }, { data: comp }, { data: wl }, { data: el }] = await Promise.all([
          supabase.from("profile").select("*").limit(1).maybeSingle(),
          supabase.from("schedule").select("*").order("day_of_week"),
          supabase.from("player_stats").select("*").limit(1).maybeSingle(),
          supabase.from("quest_completions").select("*").eq("date", DATE),
          supabase.from("weight_log").select("*").order("date", { ascending: true }),
          supabase.from("exp_log").select("*").order("created_at", { ascending: false }).limit(60),
        ]);
        state.profile = p || null;
        state.schedule = sched || [];
        state.stats = st || null;
        state.completions = comp || [];
        state.weightLog = wl || [];
        state.expLog = el || [];
        if (!state.scheduleForm) state.scheduleForm = buildScheduleForm(state.schedule);
        if (!state.profileForm) state.profileForm = profileToForm(state.profile);
      } catch (e) {
        console.error(e);
        state.error = e.message || "Failed to load data from Supabase.";
      } finally {
        state.loading = false; render();
      }
    }

    // NEW: the Schedule screen always gets all 7 days, even if the "schedule" table is empty
    // or missing some days. Missing days default to Mon-Fri = training, Sat/Sun = rest.
    function buildScheduleForm(rows) {
      return [1, 2, 3, 4, 5, 6, 0].map((dow) => {
        const row = (rows || []).find((s) => s.day_of_week === dow);
        return row ? { ...row } : { day_of_week: dow, is_training_day: dow >= 1 && dow <= 5, split_slot: null };
      });
    }

    function profileToForm(p) {
      return {
        name: p?.name || "",
        age: p?.age ?? "",
        height_cm: p?.height_cm ?? "",
        weight_kg: p?.weight_kg ?? "",
        sex: p?.sex || "male",
        activity_level: p?.activity_level || "light",
        deficit_preset: p?.deficit_preset || "moderate",
      };
    }

    function isQuestDone(type, key) {
      return state.completions.some((c) => c.quest_type === type && c.quest_key === key && c.completed);
    }

    async function addExp(amount, source, detail) {
      const prevTotal = state.stats?.total_exp ?? 0;
      const newTotal = prevTotal + amount;
      const prevRank = rankForExp(prevTotal);
      const newRank = rankForExp(newTotal);
      await supabase.from("exp_log").insert({ date: DATE, source, detail, exp_gained: amount });
      const updates = { total_exp: newTotal, updated_at: new Date().toISOString() };
      if (source === "training_quest") updates.str_stat = (state.stats?.str_stat ?? 0) + 1;
      if (source === "rest_quest" || (source === "daily_quest" && detail?.toLowerCase().includes("walk")))
        updates.agi_stat = (state.stats?.agi_stat ?? 0) + 1;
      if (state.stats?.id) await supabase.from("player_stats").update(updates).eq("id", state.stats.id);
      else await supabase.from("player_stats").insert(updates);
      if (newRank !== prevRank) state.rankUpEvent = { from: prevRank, to: newRank };
      await fetchAll();
    }

    async function completeQuest(type, key, expReward, detail) {
      if (isQuestDone(type, key)) return;
      await supabase.from("quest_completions").insert({ date: DATE, quest_type: type, quest_key: key, exp_reward: expReward, completed: true });
      const source = type === "training" ? "training_quest" : type === "rest" ? "rest_quest" : "daily_quest";
      await addExp(expReward, source, detail);
      state.toast = { title: type === "training" ? "TRAINING QUEST COMPLETE" : "QUEST COMPLETE", subtitle: `+${expReward} EXP · ${detail}` };
      render();
      setTimeout(() => { state.toast = null; render(); }, 2200);
    }

    async function maybeUpdateStreak(derived) {
      if (!state.stats || !derived.allTodayDone) return;
      if (state.stats.last_full_day_date === DATE) return;
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const continued = state.stats.last_full_day_date === yesterday;
      const newStreak = continued ? (state.stats.streak_count ?? 0) + 1 : 1;
      await supabase.from("player_stats").update({ streak_count: newStreak, last_full_day_date: DATE, vit_stat: (state.stats.vit_stat ?? 0) + 1 }).eq("id", state.stats.id);
      await fetchAll();
    }

    async function saveProfile() {
      const f = state.profileForm;
      const fields = {
        name: f.name, age: f.age ? Number(f.age) : null, height_cm: f.height_cm ? Number(f.height_cm) : null,
        weight_kg: f.weight_kg ? Number(f.weight_kg) : null, sex: f.sex, activity_level: f.activity_level, deficit_preset: f.deficit_preset,
      };
      if (state.profile?.id) await supabase.from("profile").update({ ...fields, updated_at: new Date().toISOString() }).eq("id", state.profile.id);
      else await supabase.from("profile").insert(fields);
      await fetchAll();
    }

    async function saveSchedule() {
      const order = [1, 2, 3, 4, 5, 6, 0];
      let slot = 0;
      const withSlots = order.map((dow) => state.scheduleForm.find((s) => s.day_of_week === dow)).filter(Boolean).map((entry) => {
        if (entry.is_training_day) { slot += 1; return { ...entry, split_slot: slot }; }
        return { ...entry, split_slot: null };
      });
      // NEW: update days that already exist in the table, insert the ones that don't
      const results = await Promise.all(withSlots.map((row) => {
        const fields = { is_training_day: row.is_training_day, split_slot: row.split_slot };
        const exists = state.schedule.some((s) => s.day_of_week === row.day_of_week);
        return exists
          ? supabase.from("schedule").update(fields).eq("day_of_week", row.day_of_week)
          : supabase.from("schedule").insert({ day_of_week: row.day_of_week, ...fields });
      }));
      const failed = results.find((r) => r && r.error);
      if (!failed) state.scheduleForm = null; // on failure keep your picks on screen
      await fetchAll();
      state.toast = failed
        ? { title: "SAVE FAILED", subtitle: failed.error.message || "Could not save the schedule" }
        : { title: "SCHEDULE SAVED", subtitle: "Your training days are updated" };
      render();
      setTimeout(() => { state.toast = null; render(); }, failed ? 5000 : 2200);
    }

    async function logWeight() {
      const w = Number(state.weightInput);
      if (!w) return;
      await supabase.from("weight_log").insert({ date: DATE, weight_kg: w });
      state.profileForm.weight_kg = w;
      await supabase.from("profile").update({ weight_kg: w, updated_at: new Date().toISOString() }).eq("id", state.profile.id);
      state.weightInput = "";
      await fetchAll();
    }

    // ============================================================
    // NEW — REST TIMER: tap a set when you finish it, then it counts down your rest
    // ============================================================
    const REST_SECONDS = 60; // <- change this to make the rest longer/shorter
    let restInterval = null;
    let restAudio = null;

    const setKey = (slot, i) => `${slot}-${i}`;
    const fmtRest = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

    function restRemaining() {
      if (!state.restTimer) return 0;
      return Math.max(0, Math.ceil((state.restTimer.endsAt - Date.now()) / 1000));
    }

    function unlockRestAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!restAudio) restAudio = new AC();
        if (restAudio.state === "suspended") restAudio.resume();
      } catch (e) { /* audio is optional */ }
    }

    function restAlert() {
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { }
      try {
        if (!restAudio) return;
        const osc = restAudio.createOscillator();
        const gain = restAudio.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(restAudio.destination);
        osc.start();
        osc.stop(restAudio.currentTime + 0.35);
      } catch (e) { /* audio is optional */ }
    }

    function stopRest() {
      if (restInterval) clearInterval(restInterval);
      restInterval = null;
      state.restTimer = null;
    }

    function tickRest() {
      if (!state.restTimer) { stopRest(); return; }
      const left = restRemaining();
      if (left <= 0) { stopRest(); restAlert(); render(); return; }
      // update only the countdown text (no full re-render every second)
      document.querySelectorAll("[data-rest-label]").forEach((el) => {
        if (el.dataset.restLabel === state.restTimer.key) el.textContent = fmtRest(left);
      });
    }

    function startRest(key) {
      state.setsDone[key] = true;
      state.restTimer = { key, endsAt: Date.now() + REST_SECONDS * 1000 };
      unlockRestAudio();
      if (restInterval) clearInterval(restInterval);
      restInterval = setInterval(tickRest, 250);
      render();
    }

    // if the phone was locked / tab in background, catch up as soon as you come back
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tickRest(); });

    // ============================================================
    // 5. DERIVED STATE
    // ============================================================
    function computeDerived() {
      const totalExp = state.stats?.total_exp ?? 0;
      const rank = rankForExp(totalExp);
      const progress = rankProgress(totalExp);
      const level = levelForExp(totalExp);
      const todayDow = dayOfWeek(DATE);
      const todayEntry = state.schedule.find((s) => s.day_of_week === todayDow);
      const isTrainingDay = Boolean(todayEntry?.is_training_day);
      const trainingDays = state.schedule.filter((s) => s.is_training_day).sort((a, b) => a.split_slot - b.split_slot);

      let splitDayForToday = null;
      if (isTrainingDay && trainingDays.length) {
        const idx = trainingDays.findIndex((s) => s.day_of_week === todayDow);
        splitDayForToday = BASE_SPLIT[idx % BASE_SPLIT.length].id;
      }

      let tomorrowPreview = null;
      if (state.schedule.length) {
        const tomorrowDow = (todayDow + 1) % 7;
        const entry = state.schedule.find((s) => s.day_of_week === tomorrowDow);
        if (entry?.is_training_day) {
          const idx = trainingDays.findIndex((s) => s.day_of_week === tomorrowDow);
          if (idx !== -1) {
            const day = BASE_SPLIT[idx % BASE_SPLIT.length];
            tomorrowPreview = { isTrainingDay: true, dayName: day.name };
          }
        } else {
          tomorrowPreview = { isTrainingDay: false };
        }
      }

      const todaysWorkout = splitDayForToday ? buildWorkoutForDay(splitDayForToday, rank) : null;
      const todaysDailyQuests = isTrainingDay ? TRAINING_DAY_DAILY_QUESTS : REST_DAY_QUESTS;
      const trainingQuestKey = todaysWorkout ? `training_day${todaysWorkout.id}` : null;
      const trainingDone = trainingQuestKey ? isQuestDone("training", trainingQuestKey) : false;
      const dailyType = isTrainingDay ? "daily" : "rest";
      const dailyDoneCount = todaysDailyQuests.filter((q) => isQuestDone(dailyType, q.key)).length;
      const dailyAllDone = dailyDoneCount === todaysDailyQuests.length;
      const allTodayDone = isTrainingDay ? (dailyAllDone && trainingDone) : dailyAllDone;

      return { totalExp, rank, progress, level, isTrainingDay, todaysWorkout, tomorrowPreview, todaysDailyQuests, dailyType, dailyDoneCount, trainingQuestKey, trainingDone, allTodayDone, trainingDays };
    }

    // ---------- NEW: SET BUTTONS WITH REST COUNTDOWN ----------
    function renderSetChips(ex, d) {
      const chips = Array.from({ length: ex.sets }, (_, i) => {
        const key = setKey(ex.slot, i);
        const resting = state.restTimer?.key === key;
        const done = !resting && (d.trainingDone || Boolean(state.setsDone[key]));
        const cls = resting
          ? "border-gold bg-gold/10 text-gold"
          : done
            ? "border-cyan/60 bg-cyan/5 text-cyan"
            : "border-line bg-panel-raised text-ink-dim active:bg-cyan/10";
        const label = resting
          ? `<span data-rest-label="${key}">${fmtRest(restRemaining())}</span>`
          : done ? `✓ SET ${i + 1}` : `SET ${i + 1}`;
        return `<button data-action="start-rest" data-key="${key}" ${d.trainingDone ? "disabled" : ""}
          class="flex-1 min-w-[56px] py-1.5 border font-display text-[10px] tracking-wide ${cls}">${label}</button>`;
      }).join("");
      return `<div class="flex flex-wrap gap-1.5 mt-1.5">${chips}</div>`;
    }

    // ---------- NEW: "TRAINING COMPLETE" MESSAGE + TOMORROW'S WORKOUT ----------
    function getNextWorkout(d) {
      if (!state.schedule.length || !d.trainingDays.length) return null;
      const todayDow = dayOfWeek(DATE);
      for (let offset = 1; offset <= 7; offset++) {
        const dow = (todayDow + offset) % 7;
        const entry = state.schedule.find((s) => s.day_of_week === dow);
        if (!entry?.is_training_day) continue;
        const idx = d.trainingDays.findIndex((s) => s.day_of_week === dow);
        if (idx === -1) continue;
        const day = BASE_SPLIT[idx % BASE_SPLIT.length];
        const label = DAYS_UI.find((x) => x.dow === dow)?.label || "";
        return { offset, label, workout: buildWorkoutForDay(day.id, d.rank) };
      }
      return null;
    }

      <div class="px-4 pt-safe pb-28 max-w-md mx-auto">
        <header class="pt-6 pb-4">
          <p class="text-cyan text-[11px] tracking-[0.35em] font-body">CONFIGURATION</p>
          <h1 class="font-display text-2xl mt-1">Weekly Schedule</h1>
          <p class="text-ink-dim text-sm font-body mt-1">Choose your training days. Everything else becomes a Recovery Zone.</p>
          ${state.schedule.length === 0 ? `<p class="text-gold text-xs font-body mt-2">No schedule saved yet. Pick your days, then tap SAVE SCHEDULE.</p>` : ""}
        </header>
        <div class="panel px-4 py-4">
          <ul class="divide-y divide-line">
            ${DAYS_UI.map((d) => {
        const entry = local.find((s) => s.day_of_week === d.dow);
        const isOn = Boolean(entry?.is_training_day);
        return `
              <li class="flex items-center justify-between py-3">
                <span class="font-body text-sm text-ink">${d.label}</span>
                <button data-action="toggle-day" data-dow="${d.dow}" class="relative w-14 h-8 border transition-colors ${isOn ? "border-cyan bg-cyan/15" : "border-line bg-panel-raised"}">
                  <span class="absolute top-1 h-5 w-5 transition-all ${isOn ? "left-7 bg-cyan" : "left-1 bg-ink-faint"}"></span>
                </button>
              </li>`;
      }).join("")}
          </ul>
        </div>
        ${trainingCount === 0 ? `<p class="text-danger text-xs font-body mt-3">Pick at least one training day to receive Training Quests.</p>` : ""}
        ${preview.length ? `
        <div class="panel px-4 py-4 mt-4">
          <p class="text-ink-dim text-xs font-body tracking-wide mb-3">SPLIT PREVIEW</p>
          <ul class="space-y-2">
            ${preview.map((p) => `<li class="flex items-center justify-between text-sm font-body"><span class="text-ink-dim">${p.short}</span><span class="text-ink">${p.splitDay.name}</span></li>`).join("")}
          </ul>
          <p class="text-ink-faint text-[11px] font-body mt-3">The split cycles through your ${trainingCount} chosen days in order, then repeats.</p>
        </div>` : ""}
        <button data-action="save-schedule" ${trainingCount === 0 ? "disabled" : ""} class="mt-5 w-full py-3 bg-cyan/10 border border-cyan text-cyan font-display text-xs tracking-wide active:bg-cyan/20 disabled:opacity-40">SAVE SCHEDULE</button>
      </div>`;
    }

    function renderProfile() {
      const f = state.profileForm || profileToForm(state.profile);
      const bmr = calcBMR({ sex: f.sex, weightKg: Number(f.weight_kg), heightCm: Number(f.height_cm), age: Number(f.age) });
      const tdee = calcTDEE({ bmr, activityKey: f.activity_level });
      const deficits = calcDeficitTargets(tdee);
      const selectedDeficit = deficits.find((x) => x.key === f.deficit_preset);
      return `
      <div class="px-4 pt-safe pb-28 max-w-md mx-auto">
        <header class="pt-6 pb-4">
          <p class="text-cyan text-[11px] tracking-[0.35em] font-body">HUNTER PROFILE</p>
          <h1 class="font-display text-2xl mt-1">Your Info</h1>
        </header>
        <div class="panel px-4 py-4">
          <div class="space-y-3">
            <label class="block"><span class="block text-ink-faint text-xs font-body mb-1">Name</span>
              <input class="input" data-field="name" value="${f.name}" placeholder="Your name" /></label>
            <div class="grid grid-cols-2 gap-3">
              <label class="block"><span class="block text-ink-faint text-xs font-body mb-1">Age</span>
                <input class="input" type="number" inputmode="numeric" data-field="age" value="${f.age}" /></label>
              <label class="block"><span class="block text-ink-faint text-xs font-body mb-1">Sex</span>
                <select class="input" data-field="sex">
                  <option value="male" ${f.sex === "male" ? "selected" : ""}>Male</option>
                  <option value="female" ${f.sex === "female" ? "selected" : ""}>Female</option>
                </select></label>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <label class="block"><span class="block text-ink-faint text-xs font-body mb-1">Height (cm)</span>
                <input class="input" type="number" inputmode="decimal" data-field="height_cm" value="${f.height_cm}" /></label>
              <label class="block"><span class="block text-ink-faint text-xs font-body mb-1">Weight (kg)</span>
                <input class="input" type="number" inputmode="decimal" data-field="weight_kg" value="${f.weight_kg}" /></label>
            </div>
            <label class="block"><span class="block text-ink-faint text-xs font-body mb-1">Activity level</span>
              <select class="input" data-field="activity_level">
                ${ACTIVITY_LEVELS.map((l) => `<option value="${l.key}" ${f.activity_level === l.key ? "selected" : ""}>${l.label}</option>`).join("")}
              </select></label>
          </div>
          <button data-action="save-profile" class="mt-4 w-full py-3 bg-cyan/10 border border-cyan text-cyan font-display text-xs tracking-wide active:bg-cyan/20">SAVE PROFILE</button>
        </div>

        <div class="panel px-4 py-4 mt-4">
          <p class="text-ink-dim text-xs font-body tracking-wide mb-3">CALORIE TARGETS</p>
          ${bmr && tdee ? `
            <div class="grid grid-cols-2 gap-3">
              <div class="border border-line bg-panel-raised px-3 py-2.5"><p class="text-[10px] text-ink-faint font-body">BMR</p><p class="font-display text-lg text-ink mt-0.5">${Math.round(bmr)} <span class="text-xs text-ink-faint font-body">kcal</span></p></div>
              <div class="border border-line bg-panel-raised px-3 py-2.5"><p class="text-[10px] text-ink-faint font-body">Maintenance (TDEE)</p><p class="font-display text-lg text-ink mt-0.5">${tdee} <span class="text-xs text-ink-faint font-body">kcal</span></p></div>
            </div>
            <p class="text-ink-dim text-xs font-body tracking-wide mt-5 mb-2">DEFICIT TARGET</p>
            <div class="space-y-2">
              ${DEFICIT_PRESETS.map((preset) => {
        const dd = deficits.find((x) => x.key === preset.key);
        const selected = f.deficit_preset === preset.key;
        return `
                <button data-action="select-deficit" data-key="${preset.key}" class="w-full flex items-center justify-between px-3 py-2.5 border text-left ${selected ? "border-cyan bg-cyan/5" : "border-line bg-panel-raised"}">
                  <span class="font-body text-sm text-ink">${preset.label}<span class="text-ink-faint text-xs ml-2">-${preset.perDay} kcal/day</span></span>
                  <span class="font-display text-sm text-cyan">${dd?.target} kcal</span>
                </button>`;
      }).join("")}
            </div>
            ${selectedDeficit ? `<p class="text-ink-faint text-[11px] font-body mt-3">At this rate, expect roughly ${selectedDeficit.weeklyLossKg} kg/week of loss. Eat around <span class="text-ink">${selectedDeficit.target} kcal/day</span>.</p>` : ""}
          ` : `<p class="text-ink-faint text-sm font-body">Fill in your age, sex, height and weight above to see your calorie targets.</p>`}
        </div>

        <div class="panel px-4 py-4 mt-4">
          <p class="text-ink-dim text-xs font-body tracking-wide mb-3">LOG TODAY'S WEIGHT</p>
          <div class="flex gap-2">
            <input class="input flex-1" type="number" inputmode="decimal" placeholder="kg" data-field="weightInput" value="${state.weightInput}" />
            <button data-action="log-weight" class="px-4 border border-cyan text-cyan font-display text-xs active:bg-cyan/10">LOG</button>
          </div>
        </div>
      </div>`;
    }

    function sparkline(points) {
      if (points.length < 2) return "";
      const w = 300, h = 140, pad = 10;
      const vals = points.map((p) => p.kg);
      const min = Math.min(...vals), max = Math.max(...vals);
      const span = max - min || 1;
      const stepX = (w - pad * 2) / (points.length - 1);
      const coords = points.map((p, i) => {
        const x = pad + i * stepX;
        const y = h - pad - ((p.kg - min) / span) * (h - pad * 2);
        return [x, y];
      });
      const path = coords.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
      const dots = coords.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#4CD3FF"/>`).join("");
      return `<svg viewBox="0 0 ${w} ${h}" class="w-full" style="height:160px">
        <path d="${path}" fill="none" stroke="#4CD3FF" stroke-width="2"/>
        ${dots}
      </svg>
      <div class="flex justify-between text-[10px] text-ink-faint font-body mt-1"><span>${points[0].date}</span><span>${points[points.length - 1].date}</span></div>`;
    }

    function sourceLabel(source) {
      if (source === "training_quest") return "Training Quest";
      if (source === "rest_quest") return "Recovery Quest";
      return "Daily Quest";
    }

    function renderHistory(d) {
      const weightData = state.weightLog.map((w) => ({ date: w.date.slice(5), kg: Number(w.weight_kg) }));
      return `
      <div class="px-4 pt-safe pb-28 max-w-md mx-auto">
        <header class="pt-6 pb-4">
          <p class="text-cyan text-[11px] tracking-[0.35em] font-body">RECORDS</p>
          <h1 class="font-display text-2xl mt-1">Hunter Log</h1>
        </header>
        <div class="panel px-4 py-4">
          <p class="text-ink-dim text-xs font-body tracking-wide mb-3">RANK LADDER</p>
          <div class="space-y-2">
            ${RANKS.map((r) => {
        const reached = d.totalExp >= RANK_THRESHOLDS[r];
        const isCurrent = r === d.rank;
        return `
              <div class="flex items-center justify-between px-3 py-2 border ${isCurrent ? "border-cyan bg-cyan/5" : reached ? "border-line" : "border-line/50"}">
                <span class="font-display text-sm ${isCurrent ? "text-cyan" : reached ? "text-ink" : "text-ink-faint"}">Rank ${r}</span>
                <span class="text-ink-faint text-xs font-body">${RANK_THRESHOLDS[r]} EXP</span>
              </div>`;
      }).join("")}
          </div>
        </div>
        ${weightData.length > 1 ? `
        <div class="panel px-4 py-4 mt-4">
          <p class="text-ink-dim text-xs font-body tracking-wide mb-3">WEIGHT TREND</p>
          ${sparkline(weightData)}
        </div>` : ""}
        <div class="panel px-4 py-4 mt-4">
          <p class="text-ink-dim text-xs font-body tracking-wide mb-3">RECENT EXP</p>
          ${state.expLog.length === 0 ? `<p class="text-ink-faint text-sm font-body">No EXP earned yet. Complete a quest to begin.</p>` : `
          <ul class="divide-y divide-line">
            ${state.expLog.map((e) => `
            <li class="flex items-center justify-between py-2 text-sm font-body">
              <div><p class="text-ink">${e.detail || sourceLabel(e.source)}</p><p class="text-ink-faint text-xs">${e.date}</p></div>
              <span class="text-gold">+${e.exp_gained}</span>
            </li>`).join("")}
          </ul>`}
        </div>
      </div>`;
    }

    function renderSetupNeeded() {
      return `
      <div class="min-h-screen flex items-center justify-center px-6 pt-safe pb-safe">
        <div class="panel shadow-glow max-w-sm w-full px-4 py-4">
          <p class="text-cyan text-xs tracking-[0.3em] font-body mb-2">SYSTEM OFFLINE</p>
          <h1 class="font-display text-xl text-ink mb-3">Connect Supabase</h1>
          <p class="text-ink-dim text-sm font-body leading-relaxed mb-4">
            Open <code class="text-cyan">index.html</code> and set <code class="text-cyan">SUPABASE_URL</code> and
            <code class="text-cyan">SUPABASE_ANON_KEY</code> near the top of the script block.
          </p>
          <pre class="bg-panel-raised border border-line px-3 py-2 text-xs text-ink font-body overflow-x-auto mb-4">const SUPABASE_URL = "https://xxxx.supabase.co";
const SUPABASE_ANON_KEY = "eyJ...";</pre>
          <p class="text-ink-dim text-sm font-body leading-relaxed">
            Then run <code class="text-cyan">schema.sql</code> once in your Supabase project's SQL Editor.
            See <code class="text-cyan">README.md</code> for full setup steps.
          </p>
        </div>
      </div>`;
    }

    // ============================================================
    // 7. MASTER RENDER + EVENT DELEGATION
    // ============================================================
    function render() {
      const app = document.getElementById("app");
      if (!isConfigured) { app.innerHTML = renderSetupNeeded(); return; }
      if (state.loading) {
        app.innerHTML = `<div class="min-h-screen flex items-center justify-center"><p class="font-display text-cyan text-sm tracking-widest animate-pulse">LOADING SYSTEM...</p></div>`;
        return;
      }
      if (state.error) {
        app.innerHTML = `<div class="min-h-screen flex items-center justify-center px-6 text-center"><p class="text-danger font-body text-sm">${state.error}</p></div>`;
        return;
      }
      const d = computeDerived();
      let screen = "";
      if (state.tab === "status") screen = renderStatus(d);
      else if (state.tab === "quests") screen = renderQuests(d);
      else if (state.tab === "schedule") screen = renderSchedule();
      else if (state.tab === "log") screen = renderHistory(d);
      else if (state.tab === "profile") screen = renderProfile();

      app.innerHTML = `
        <div class="min-h-screen bg-void">
          ${renderToast()}
          ${renderRankUpModal()}
          ${renderTrainingCompleteModal(d)}
          ${screen}
          ${renderBottomNav()}
        </div>`;

      maybeUpdateStreak(d);
    }

    document.body.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      const d = computeDerived();

      if (action === "nav") { state.tab = btn.dataset.tab; render(); }
      else if (action === "complete-daily") {
        await completeQuest(d.dailyType, btn.dataset.key, Number(btn.dataset.reward), btn.dataset.text);
      }
      else if (action === "toggle-exercise") {
        state.checkedExercises[btn.dataset.slot] = !state.checkedExercises[btn.dataset.slot];
        render();
      }
      else if (action === "complete-training") {
        if (!d.todaysWorkout) return;
        await completeQuest("training", d.trainingQuestKey, trainingExpReward(d.rank), d.todaysWorkout.name);
        state.checkedExercises = {};
        // NEW: clear set tracking + rest timer, then show the "training complete" popup
        state.setsDone = {};
        stopRest();
        if (isQuestDone("training", d.trainingQuestKey)) state.trainingCompleteEvent = true;
        render();
      }
      else if (action === "start-rest") {
        const key = btn.dataset.key;
        if (state.restTimer && state.restTimer.key === key) { stopRest(); render(); } // tap again = skip rest
        else if (!state.setsDone[key]) startRest(key);
      }
      else if (action === "close-training-complete") { state.trainingCompleteEvent = false; render(); }
      else if (action === "toggle-day") {
        const dow = Number(btn.dataset.dow);
        state.scheduleForm = state.scheduleForm.map((s) => s.day_of_week === dow ? { ...s, is_training_day: !s.is_training_day } : s);
        render();
      }
      else if (action === "save-schedule") { await saveSchedule(); }
      else if (action === "save-profile") { await saveProfile(); }
      else if (action === "select-deficit") { state.profileForm.deficit_preset = btn.dataset.key; render(); }
      else if (action === "log-weight") { await logWeight(); }
      else if (action === "close-rankup") { state.rankUpEvent = null; render(); }
    });

    document.body.addEventListener("input", (e) => {
      const field = e.target.dataset.field;
      if (!field) return;
      if (field === "weightInput") { state.weightInput = e.target.value; return; }
      if (!state.profileForm) state.profileForm = profileToForm(state.profile);
      state.profileForm[field] = e.target.value;
    });
    document.body.addEventListener("change", (e) => {
      const field = e.target.dataset.field;
      if (!field || !state.profileForm) return;
      state.profileForm[field] = e.target.value;
      if (field === "sex" || field === "activity_level") render();
    });

    // ============================================================
    // 8. BOOT
    // ============================================================
    if (isConfigured) fetchAll();
    else render();
  </script>
</body>

</html>
